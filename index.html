<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Network Binary — industry-leading Cybersecurity, Networking, Cloud and IT training with certified instructors and hands-on labs." />
    <meta name="theme-color" content="#0B1B2E" />
    <title>Network Binary — Master Cybersecurity & IT Skills</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1B2E'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%237FC4F0' stroke-width='3'/%3E%3Cpath d='M16 8a8 8 0 0 1 0 16z' fill='%232F8FD8'/%3E%3C/svg%3E" />
    <!-- Set theme before first paint (no flash) -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("nb-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
